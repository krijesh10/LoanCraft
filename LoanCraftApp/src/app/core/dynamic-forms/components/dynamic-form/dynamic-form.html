<form [formGroup]="form" (ngSubmit)="onSubmit()" class="dynamic-form-container">
    @for (control of controls; track control.key) {
    <!-- Renders each widget using our Step 1.3 component! -->
    <app-dynamic-form-control [control]="control" [form]="form">
    </app-dynamic-form-control>
    }

    @if (showSubmitButton) {
    <button type="submit" [disabled]="!form.valid" class="submit-btn">
        {{ submitLabel }}
    </button>
    }
</form>
