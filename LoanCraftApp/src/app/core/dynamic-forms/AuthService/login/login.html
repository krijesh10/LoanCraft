<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo-badge">⚡</div>
      <h2>LoanCraft Studio</h2>
      <p class="brand-tagline">Enterprise Underwriting & Workflow Engine</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">
        <span>⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="emailInput">Corporate Email</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input 
            id="emailInput" 
            type="email" 
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)" 
            name="email" 
            placeholder="name@company.com" 
            required 
          />
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            id="passwordInput" 
            type="password" 
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)" 
            name="password" 
            placeholder="••••••••" 
            required 
          />
        </div>
      </div>

      <button type="submit" class="btn-signin" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="btn-spinner"></span>
          <span>Verifying Credentials...</span>
        } @else {
          <span>Sign In to Studio →</span>
        }
      </button>
    </form>

    <div class="demo-credentials-card">
      <div class="demo-header">
        <span class="demo-badge">PRE-CONFIGURED USER</span>
        <span class="demo-sub">Development Account</span>
      </div>
      <div class="demo-creds">
        <div class="cred-row">
          <span class="cred-label">Email:</span>
          <code class="cred-val">underwriter@loancraft.com</code>
        </div>
        <div class="cred-row">
          <span class="cred-label">Password:</span>
          <code class="cred-val">Password123!</code>
        </div>
      </div>
      <button type="button" class="btn-fill-demo" (click)="fillDemoCredentials()">
        ⚡ Auto-fill Demo Credentials
      </button>
    </div>
  </div>
</div>
