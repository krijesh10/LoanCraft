name: LoanCraft CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  # ========================================================
  # JOB 1: Build, Test & Deploy .NET 9 Web API
  # ========================================================
  build-and-deploy-backend:
    name: Build & Deploy .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore LoanCraft/LoanCraft.sln

      - name: Build solution (Release)
        run: dotnet build LoanCraft/LoanCraft.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test LoanCraft/LoanCraft.sln --no-build --configuration Release --verbosity normal

      # Package the compiled API into a standalone folder
      - name: Publish API
        run: dotnet publish LoanCraft/LoanCraft.API/LoanCraft.API.csproj --configuration Release --output ./publish-backend

      # Deploy to Azure App Service (only runs on push to main branch)
      - name: Deploy to Azure App Service
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'loancraft-api-krijesh'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './publish-backend'

  # ========================================================
  # JOB 2: Build & Deploy Angular Frontend
  # ========================================================
  build-and-deploy-frontend:
    name: Build & Deploy Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: LoanCraftApp/package-lock.json

      - name: Install dependencies
        working-directory: LoanCraftApp
        run: npm ci

      - name: Build Angular app
        working-directory: LoanCraftApp
        run: npm run build -- --configuration production

      # Deploy to Azure Static Web Apps (only runs on push to main branch)
      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/LoanCraftApp'
          output_location: 'dist/loancraftApp/browser'
